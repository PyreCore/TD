<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice</title>

    <!-- liage du html avec du css -->
     <link rel="stylesheet" href="css/style.css">

</head>

<!-- les éléments inscrits dans le body seront visuel sur mon site -->
<body>
    <!-- Premiere etape structuration de l'entete avec header  -->
     <header>
        <h2 class="logo">MVP</h2>
        <nav class="navigation">
            <!-- ici plus haut on aura le logo et dans navigation nous allons mettre tous les liens principals de notre site -->
             <a href="#">Accueil</a>
             <a href="#">About</a>
             <a href="#">service</a>
             <a href="#">contact</a>
             <!-- dans notre cas les elements visuel sont tous les elements en blanc autrement dit des liens -->
            
            <!-- création du bouton login -->
   

             <button class="btnLogin-popup">Login</button>
        </nav>
     </header>
     <!-- Troisième etape toujours dans le body mais pas dans le header (l'entete)  -->
     <div class="wrapper">
        <span class="icon-close"><ion-icon name="close-outline"></ion-icon></span>

        <div class="form-box login">
            <h2>Login</h2>
            <form action="#">

                <div class="input-box">
                    <span class="icon"><ion-icon name="mail"></ion-icon></span>
                    <input type="email" required>
                    <label>Email</label>
                </div>

                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                    <input type="password" required>
                    <label>Password</label>
                </div>

                <div class="remember-forgot">
                    <label><input type="checkbox">
                    remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn">Login</button>
                <div class="login-register">
                    <p>Don't have an account?<a href="#" class="register-link"> Register</a></p>
                </div>
            </form>
        </div>

        <!-- Quarième etape register: -->
        <div class="form-box register">
            <h2>Registration</h2>
            <form action="#">

                 <div class="input-box">
                    <span class="icon"><ion-icon name="person"></ion-icon></span>
                    <input type="text" required>
                    <label>Username</label>
                </div>

                <div class="input-box">
                    <span class="icon"><ion-icon name="mail"></ion-icon></span>
                    <input type="email" required>
                    <label>Email</label>
                </div>

                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                    <input type="password" required>
                    <label>Password</label>
                </div>

                <div class="remember-forgot">
                    <label><input type="checkbox">
                    I agree to the terms & conditions</label>
                </div>

                <button type="submit" class="btn">Register</button>
                <div class="login-register">
                    <p>Aleady have an account?<a href="#" class="login-link">Login</a></p>
                </div>
            </form>
        </div>
     </div>
     
     <!-- synchronisation entre html et js  -->
     <script src="js/script.js" defer></script>
     <script type = "module" src=" https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js ">
     </script> 
     <script nomodule src=" https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js "></script>
     
</body>
</html>
